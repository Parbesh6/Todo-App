<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Update Task</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow-sm p-4 mx-auto" style="max-width: 500px;">

        <h3 class="text-center mb-4">Update Task</h3>

        <form method="POST">
            {% csrf_token %}

            <label class="form-label">Task Title</label>

            
            <textarea name="title"
                      class="form-control mb-3">{{ task.title }}</textarea>

            <label class="form-label">Description</label>

            <textarea name="description"
                      class="form-control mb-3">{{ task.description }}</textarea>

            <div class="form-check mb-3">
                <input type="checkbox" name="completed"
                       class="form-check-input" id="completed"
                       {% if task.completed %}checked{% endif %}>  
                <label for="completed" class="form-check-label">
                    Completed
                </label>
            </div>

            <div class="d-flex gap-2">

                <button type="submit" class="btn btn-primary">
                    Save Changes
                </button>

                <a href="{% url 'home' %}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
