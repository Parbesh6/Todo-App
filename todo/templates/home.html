<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Todo App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>

    </style>
    <meta name="google-site-verification" content="LumR9wyJcHb6OnyC4RNN8NBPM1UE-z3Qdmd0XHwudUM" />
    <meta 
        name="description" 
        content="Organize your daily tasks easily with our Todo App. Create, update, delete, and manage your tasks to stay productive and never miss important activities." />
</head>

<body class="bg-light">
    <main role="main">

        <div class="container mt-5">

            <h1 class="text-center mb-4">My Todo List</h1>

            <!-- Add Task -->
            <div class="card shadow-sm p-4 mb-4">

                <h2>Add New Task</h2>

                <form method="POST">
                    {% csrf_token %}

                    <input type="text" name="title" class="form-control mb-3" placeholder="Enter task title" required>

                    <textarea name="description" class="form-control mb-3" placeholder="Enter description"></textarea>

                    <div class="form-check mb-3">
                        <input type="checkbox" name="completed" class="form-check-input" id="completed">
                        <label for="completed" class="form-check-label">
                            Completed
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Add Task
                    </button>
                </form>

            </div>

            <!-- Display Tasks -->
            <div class="card shadow-sm p-4">

                <h2 class="mb-3">All Tasks</h2>

                <div class="table-responsive">

                    <table class="table table-bordered table-striped table-hover">

                        <thead class="table-dark">
                            <tr>
                                <th>Title</th>
                                <th>Description</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody>

                            {% for task in tasks %}

                            <tr>

                                <td>{{ task.title }}</td>

                                <td>{{ task.description }}</td>

                                <td>
                                    {% if task.completed %}
                                    <span class="badge bg-success">
                                        Completed
                                    </span>
                                    {% else %}
                                    <span class="badge bg-warning text-dark">
                                        Pending
                                    </span>
                                    {% endif %}
                                </td>

                                <td>
                                    <a href="{% url 'update' task.id %}" class="btn btn-warning btn-sm">
                                        Update
                                    </a>

                                    <a href="{% url 'delete' task.id %}" class="btn btn-danger btn-sm">
                                        Delete
                                    </a>
                                </td>
                            </tr>

                            {% empty %}

                            <tr>
                                <td colspan="5" class="text-center text-muted">
                                    No tasks available.
                                </td>
                            </tr>

                            {% endfor %}

                        </tbody>

                    </table>

                </div>

            </div>
    </main>
